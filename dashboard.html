<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мэтчи — STARProject</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { oilBlue: '#002147', energyOrange: '#FF8C00', deepDark: '#001529' } } }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #001529; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .match-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.06); }
    </style>
</head>
<body class="min-h-screen bg-oilBlue">
    <aside class="fixed left-0 top-0 h-full w-20 md:w-64 glass border-r border-white/5 hidden sm:flex flex-col p-6 z-50">
        <div class="text-xl font-800 mb-12">STAR<span class="text-energyOrange">.</span></div>
        <nav class="space-y-4 flex-1">
            <a href="index.html" class="flex items-center gap-4 hover:bg-white/5 p-3 rounded-xl transition text-gray-400"><i class="fa-solid fa-house"></i> <span class="hidden md:inline">Главная</span></a>
            <a href="#" class="flex items-center gap-4 bg-energyOrange p-3 rounded-xl text-white font-bold"><i class="fa-solid fa-users"></i> <span class="hidden md:inline">Мэтчи</span></a>
            <a href="chat.html" class="flex items-center gap-4 hover:bg-white/5 p-3 rounded-xl transition text-gray-400"><i class="fa-solid fa-message"></i> <span class="hidden md:inline">Сообщения</span></a>
            <a href="profile.html" class="flex items-center gap-4 hover:bg-white/5 p-3 rounded-xl transition text-gray-400"><i class="fa-solid fa-user-pen"></i> <span class="hidden md:inline">О себе</span></a>
        </nav>
        <div class="pt-6 border-t border-white/10">
            <a href="index.html" onclick="localStorage.clear()" class="flex items-center gap-4 text-gray-500 hover:text-white transition"><i class="fa-solid fa-right-from-bracket"></i> <span class="hidden md:inline">Выход</span></a>
        </div>
    </aside>

    <main class="sm:ml-20 md:ml-64 p-6 md:p-12">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-3xl font-800">Твои <span class="text-energyOrange">мэтчи</span></h1>
                <p class="text-gray-400" id="statusText">Алгоритм подбирает соседей...</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right hidden md:block">
                    <p class="font-bold" id="userName">Студент</p>
                    <p class="text-[10px] text-energyOrange uppercase" id="userCourse">... курс</p>
                </div>
                <div id="userAvatarSmall" class="w-12 h-12 rounded-full bg-energyOrange flex items-center justify-center font-bold overflow-hidden border-2 border-white/10">?</div>
            </div>
        </header>

        <div id="loadingState" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <div class="w-16 h-16 border-4 border-energyOrange/20 border-t-energyOrange rounded-full animate-spin mb-6 mx-auto"></div>
            <p class="text-lg font-bold uppercase tracking-widest animate-pulse">Анализ совпадений...</p>
        </div>

        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <h2 class="text-2xl font-800 mb-4">Анкета не заполнена</h2>
            <a href="form.html" class="bg-energyOrange px-8 py-4 rounded-2xl font-bold">Заполнить анкету</a>
        </div>

        <div id="matchesContainer" class="hidden">
            <div class="flex flex-wrap gap-3 mb-8">
                <button id="matchesTab" type="button" onclick="setActiveTab('matches')" class="px-5 py-3 rounded-2xl bg-energyOrange text-white font-bold transition">Мэтчи</button>
                <button id="registeredTab" type="button" onclick="setActiveTab('registered')" class="px-5 py-3 rounded-2xl bg-white/5 text-gray-300 font-bold transition hover:bg-white/10">Зарегистрированные пользователи</button>
            </div>
            <div id="matchesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <div id="registeredGrid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </main>

    <script>
        const StarterRegisteredUsers = [
            { id: 'seed-1', name: 'Дамир Алижанов', course: '2 курс', match: '98%', budget: '12 000', habits: ['Не курит', 'Игры'], faculty: 'ФТТ', preview: 'Привет! Видел твой мэтч, ищу соседа на ФТТ...', registeredAt: 'демо' },
            { id: 'seed-2', name: 'Виктория Р.', course: '3 курс', match: '92%', budget: '15 000', habits: ['Чистота', 'Спорт'], faculty: 'ИНБ', preview: 'Ты еще ищешь комнату?', registeredAt: 'демо' },
            { id: 'seed-3', name: 'Ролан Рысбаев', course: '4 курс', match: '85%', budget: '10 000', habits: ['Тишина', 'Дизайн'], faculty: 'ФАДЭТ', preview: 'Ок, договорились!', registeredAt: 'демо' }
        ];

        let registeredUsers = [];
        let currentUserId = '';

        function escapeHtml(value) {
            return String(value || '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function normalizeCourse(course) {
            const value = String(course || '').trim();
            return value.includes('курс') ? value : `${value || '...'} курс`;
        }

        function getSavedRegisteredUsers() {
            try {
                return JSON.parse(localStorage.getItem('star_registered_users') || '[]');
            } catch (error) {
                return [];
            }
        }

        function getCurrentUser() {
            const userFio = localStorage.getItem('star_user_fio');
            if (!userFio) return null;

            const id = localStorage.getItem('star_user_id') || `user-${Date.now()}`;
            localStorage.setItem('star_user_id', id);
            return {
                id,
                name: userFio,
                course: normalizeCourse(localStorage.getItem('star_user_course')),
                match: 'Вы',
                budget: localStorage.getItem('star_user_budget') || '15 000',
                habits: JSON.parse(localStorage.getItem('star_user_habits') || '[]'),
                faculty: localStorage.getItem('star_user_faculty') || localStorage.getItem('star_user_uni') || 'УГНТУ',
                preview: 'Это ваша анкета',
                registeredAt: localStorage.getItem('star_user_registered_at') || new Date().toISOString()
            };
        }

        function ensureCurrentUserRegistered() {
            const currentUser = getCurrentUser();
            if (!currentUser) return null;

            const users = getSavedRegisteredUsers();
            const existingIndex = users.findIndex(user => user.id === currentUser.id);
            if (existingIndex >= 0) {
                users[existingIndex] = { ...users[existingIndex], ...currentUser };
            } else {
                users.push(currentUser);
            }
            localStorage.setItem('star_registered_users', JSON.stringify(users));
            return currentUser;
        }

        function getAllRegisteredUsers() {
            const savedUsers = getSavedRegisteredUsers();
            const usersById = new Map();
            [...StarterRegisteredUsers, ...savedUsers].forEach((user, index) => {
                const id = user.id || `registered-${index}`;
                usersById.set(id, {
                    id,
                    name: user.name || user.fio || 'Студент',
                    course: normalizeCourse(user.course),
                    match: user.match || `${Math.max(74, 96 - index * 4)}%`,
                    budget: user.budget || '15 000',
                    habits: Array.isArray(user.habits) && user.habits.length ? user.habits : ['Анкета заполнена'],
                    faculty: user.faculty || user.uni || 'УГНТУ',
                    preview: user.preview || 'Пользователь прошел регистрацию и готов к общению',
                    registeredAt: user.registeredAt || 'сегодня'
                });
            });
            return Array.from(usersById.values());
        }

        function openChat(matchId) {
            localStorage.setItem('star_selected_match', String(matchId));
            window.location.href = `chat.html?match=${encodeURIComponent(matchId)}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = ensureCurrentUserRegistered();
            const userAvatar = localStorage.getItem('star_user_avatar');

            if (!currentUser) {
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }

            currentUserId = currentUser.id;
            registeredUsers = getAllRegisteredUsers();
            document.getElementById('matchesContainer').addEventListener('click', (event) => {
                const chatButton = event.target.closest('[data-chat-id]');
                if (chatButton) {
                    openChat(chatButton.dataset.chatId);
                }
            });
            document.getElementById('userName').textContent = currentUser.name.split(' ')[0];
            document.getElementById('userCourse').textContent = currentUser.course;
            const avatarDiv = document.getElementById('userAvatarSmall');
            if (userAvatar) {
                avatarDiv.innerHTML = `<img src="${userAvatar}" class="w-full h-full object-cover">`;
            } else {
                avatarDiv.textContent = currentUser.name[0].toUpperCase();
            }

            document.getElementById('loadingState').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('matchesContainer').classList.remove('hidden');
                renderMatches();
                renderRegisteredUsers();
                setActiveTab('matches');
            }, 500);
        });

        function getMatchUsers() {
            return registeredUsers.filter(user => user.id !== currentUserId);
        }

        function setActiveTab(tab) {
            const showMatches = tab === 'matches';
            document.getElementById('matchesGrid').classList.toggle('hidden', !showMatches);
            document.getElementById('registeredGrid').classList.toggle('hidden', showMatches);
            document.getElementById('matchesTab').className = showMatches
                ? 'px-5 py-3 rounded-2xl bg-energyOrange text-white font-bold transition'
                : 'px-5 py-3 rounded-2xl bg-white/5 text-gray-300 font-bold transition hover:bg-white/10';
            document.getElementById('registeredTab').className = !showMatches
                ? 'px-5 py-3 rounded-2xl bg-energyOrange text-white font-bold transition'
                : 'px-5 py-3 rounded-2xl bg-white/5 text-gray-300 font-bold transition hover:bg-white/10';
            document.getElementById('statusText').textContent = showMatches
                ? `Найдено ${getMatchUsers().length} мэтча`
                : `Зарегистрировано ${registeredUsers.length} пользователей`;
        }

        function renderUserCard(user, options = {}) {
            const isCurrentUser = user.id === currentUserId;
            const action = isCurrentUser
                ? '<span class="block w-full bg-white/5 border border-white/10 py-3 rounded-xl font-bold text-center text-gray-400">Это вы</span>'
                : `<button type="button" data-chat-id="${escapeHtml(user.id)}" class="w-full bg-white/5 border border-white/10 py-3 rounded-xl font-bold hover:bg-energyOrange hover:border-energyOrange transition group">Написать <i class="fa-solid fa-paper-plane ml-2 group-hover:translate-x-1 transition"></i></button>`;
            const badge = options.showMatch
                ? `<div class="absolute top-0 right-0 bg-energyOrange/10 px-4 py-2 rounded-bl-3xl"><span class="text-energyOrange font-800 text-sm">${escapeHtml(user.match)}</span></div>`
                : `<div class="absolute top-0 right-0 bg-green-500/10 px-4 py-2 rounded-bl-3xl"><span class="text-green-400 font-800 text-[10px] uppercase">Регистрация пройдена</span></div>`;

            return `
                <div class="match-card glass p-6 rounded-3xl relative transition-all duration-300">
                    ${badge}
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-14 h-14 rounded-2xl bg-white/5 flex items-center justify-center text-xl font-bold border border-white/10">${escapeHtml(user.name[0])}</div>
                        <div>
                            <h3 class="font-bold text-sm">${escapeHtml(user.name)}</h3>
                            <p class="text-[10px] text-gray-500 uppercase">${escapeHtml(user.faculty)} • ${escapeHtml(user.course)}</p>
                        </div>
                    </div>
                    <div class="space-y-4 mb-6">
                        <div class="flex justify-between text-xs"><span>Бюджет</span><span class="font-bold">${escapeHtml(user.budget)} ₽/мес</span></div>
                        <div class="flex flex-wrap gap-1">
                            ${user.habits.map(h => `<span class="bg-white/5 px-2 py-1 rounded text-[9px] border border-white/5">${escapeHtml(h)}</span>`).join('')}
                        </div>
                    </div>
                    ${action}
                </div>
            `;
        }

        function renderMatches() {
            const matchUsers = getMatchUsers();
            document.getElementById('matchesGrid').innerHTML = matchUsers.length
                ? matchUsers.map(user => renderUserCard(user, { showMatch: true })).join('')
                : '<div class="glass p-8 rounded-3xl text-center text-gray-400 md:col-span-2 lg:col-span-3">Пока нет других зарегистрированных пользователей для мэтча.</div>';
        }

        function renderRegisteredUsers() {
            document.getElementById('registeredGrid').innerHTML = registeredUsers
                .map(user => renderUserCard(user, { showMatch: false }))
                .join('');
        }
    </script>
</body>
</html>
