<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сообщения — STARProject</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { oilBlue: '#002147', energyOrange: '#FF8C00', deepDark: '#001529' } } }
        }
    </script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); }
        .chat-item:hover { background: rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="bg-deepDark min-h-screen flex text-white overflow-hidden">
    
    <!-- Side Nav -->
    <aside class="w-20 border-r border-white/5 flex flex-col items-center py-8 gap-10 bg-oilBlue/50">
        <a href="index.html" class="text-2xl font-900 text-energyOrange italic">S.</a>
        <div class="flex flex-col gap-6">
            <a href="index.html" class="w-12 h-12 flex items-center justify-center rounded-2xl text-gray-500 hover:text-white transition"><i class="fa-solid fa-house"></i></a>
            <a href="dashboard.html" class="w-12 h-12 flex items-center justify-center rounded-2xl text-gray-500 hover:text-white transition"><i class="fa-solid fa-users"></i></a>
            <a href="#" class="w-12 h-12 flex items-center justify-center rounded-2xl bg-energyOrange text-white shadow-lg shadow-energyOrange/20"><i class="fa-solid fa-message"></i></a>
            <a href="profile.html" class="w-12 h-12 flex items-center justify-center rounded-2xl text-gray-500 hover:text-white transition"><i class="fa-solid fa-user-pen"></i></a>
        </div>
    </aside>

    <!-- Chat List -->
    <div class="w-80 border-r border-white/5 hidden md:flex flex-col bg-oilBlue/20">
        <div class="p-6 border-b border-white/5 flex justify-between items-center">
            <h2 class="text-xl font-800 uppercase tracking-tighter">Диалоги</h2>
            <span id="chatCount" class="bg-energyOrange text-[10px] px-2 py-0.5 rounded-full">0</span>
        </div>
        <div id="dialogsList" class="flex-1 overflow-y-auto"></div>
    </div>

    <!-- Active Chat -->
    <div class="flex-1 flex flex-col bg-deepDark/50">
        <!-- Chat Header -->
        <div class="p-4 border-b border-white/5 flex items-center justify-between glass">
            <div class="flex items-center gap-3">
                <div id="activeAvatar" class="w-10 h-10 rounded-lg bg-energyOrange/20 flex items-center justify-center font-bold text-energyOrange">?</div>
                <div>
                    <h3 id="activeName" class="font-bold text-sm">Выберите диалог</h3>
                    <p class="text-[9px] text-green-500 uppercase font-bold">В сети</p>
                </div>
            </div>
            <div class="flex gap-4 text-gray-400">
                <i class="fa-solid fa-phone cursor-pointer hover:text-white transition"></i>
                <i class="fa-solid fa-ellipsis-vertical cursor-pointer hover:text-white transition"></i>
            </div>
        </div>

        <!-- Messages Area -->
        <div id="messagesArea" class="flex-1 p-6 space-y-4 overflow-y-auto flex flex-col"></div>

        <!-- Input Area -->
        <div class="p-4 glass border-t border-white/5">
            <div class="flex items-center gap-4 bg-white/5 rounded-2xl px-4 py-2 border border-white/10">
                <i class="fa-solid fa-paperclip text-gray-500 cursor-pointer hover:text-white transition"></i>
                <input id="messageInput" type="text" placeholder="Напишите сообщение..." class="flex-1 bg-transparent border-none outline-none text-sm py-2">
                <button id="sendButton" type="button" class="w-10 h-10 bg-energyOrange rounded-xl flex items-center justify-center cursor-pointer hover:scale-105 transition">
                    <i class="fa-solid fa-paper-plane text-white"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const StarterMatches = [
            {
                id: 'seed-1',
                name: 'Дамир Алижанов',
                textColor: '#FF8C00',
                time: '14:40',
                preview: 'Привет! Видел твой мэтч, ищу соседа на ФТТ...',
                messages: [
                    { type: 'incoming', text: 'Привет! 👋 Увидел, что мы совпали по интересам и бюджету. Я как раз учусь на ФТТ, ищу адекватного соседа без вредных привычек.', time: '14:40' },
                    { type: 'outgoing', text: 'Привет! Да, я тоже не курю и ценю тишину. А в каком районе планируешь снимать?', time: '14:42' }
                ]
            },
            {
                id: 'seed-2',
                name: 'Виктория Р.',
                textColor: '#60A5FA',
                time: 'Вчера',
                preview: 'Ты еще ищешь комнату?',
                messages: [
                    { type: 'incoming', text: 'Привет! Мы совпали по чистоте и бюджету. Ты еще ищешь комнату?', time: 'Вчера' }
                ]
            },
            {
                id: 'seed-3',
                name: 'Ролан Рысбаев',
                textColor: '#C084FC',
                time: '09.05',
                preview: 'Ок, договорились!',
                messages: [
                    { type: 'incoming', text: 'Привет! Вижу, что нам обоим важны тишина и спокойный режим.', time: '09.05' },
                    { type: 'outgoing', text: 'Отлично, давай обсудим варианты жилья после пар.', time: '09.05' },
                    { type: 'incoming', text: 'Ок, договорились!', time: '09.05' }
                ]
            }
        ];

        let Matches = [];
        let activeMatchId = 'seed-1';

        function getRegisteredChatUsers() {
            const currentUserId = localStorage.getItem('star_user_id');
            let savedUsers = [];
            try {
                savedUsers = JSON.parse(localStorage.getItem('star_registered_users') || '[]');
            } catch (error) {
                savedUsers = [];
            }
            const starterIds = new Set(StarterMatches.map(match => match.id));
            return savedUsers
                .filter(user => user.id && user.id !== currentUserId && !starterIds.has(user.id))
                .map((user, index) => ({
                    id: user.id,
                    name: user.name || 'Студент',
                    textColor: ['#FF8C00', '#60A5FA', '#C084FC'][index % 3],
                    time: 'сегодня',
                    preview: user.preview || 'Пользователь прошел регистрацию и готов к общению',
                    messages: [
                        { type: 'incoming', text: `Привет! Я ${user.name || 'студент'}, прошел регистрацию в STARProject и готов обсудить совместное жилье.`, time: 'сегодня' }
                    ]
                }));
        }

        document.addEventListener('DOMContentLoaded', () => {
            Matches = [...StarterMatches, ...getRegisteredChatUsers()];
            const params = new URLSearchParams(window.location.search);
            const requestedMatch = params.get('match') || localStorage.getItem('star_selected_match');
            if (Matches.some(match => String(match.id) === String(requestedMatch))) {
                activeMatchId = requestedMatch;
            }

            document.getElementById('dialogsList').addEventListener('click', (event) => {
                const dialogButton = event.target.closest('[data-match-id]');
                if (dialogButton) {
                    selectMatch(dialogButton.dataset.matchId);
                }
            });
            renderDialogs();
            selectMatch(activeMatchId);

            document.getElementById('sendButton').addEventListener('click', sendMessage);
            document.getElementById('messageInput').addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    sendMessage();
                }
            });
        });

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('\"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function renderDialogs() {
            document.getElementById('chatCount').textContent = Matches.length;
            document.getElementById('dialogsList').innerHTML = Matches.map(match => `
                <button type="button" data-match-id="${escapeHtml(match.id)}" class="w-full text-left p-4 flex items-center gap-4 cursor-pointer chat-item border-b border-white/5 transition ${match.id === activeMatchId ? 'bg-energyOrange/10' : 'opacity-70'}">
                    <div class="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center font-bold" style="color: ${match.textColor}">${escapeHtml(match.name[0])}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center mb-1">
                            <h4 class="font-bold text-sm truncate">${escapeHtml(match.name)}</h4>
                            <span class="text-[9px] text-gray-500">${escapeHtml(match.time)}</span>
                        </div>
                        <p class="text-xs text-gray-400 truncate">${escapeHtml(match.preview)}</p>
                    </div>
                </button>
            `).join('');
        }

        function selectMatch(matchId) {
            const match = Matches.find(item => item.id === matchId) || Matches[0];
            activeMatchId = match.id;
            localStorage.setItem('star_selected_match', String(match.id));
            document.getElementById('activeName').textContent = match.name;
            document.getElementById('activeAvatar').textContent = match.name[0];
            document.getElementById('activeAvatar').className = 'w-10 h-10 rounded-lg bg-energyOrange/20 flex items-center justify-center font-bold';
            document.getElementById('activeAvatar').style.color = match.textColor;
            renderDialogs();
            renderMessages(match);
        }

        function renderMessages(match) {
            const messagesArea = document.getElementById('messagesArea');
            messagesArea.innerHTML = `
                <div class="self-center bg-white/5 px-3 py-1 rounded-full text-[10px] text-gray-500 mb-4 uppercase tracking-widest font-bold">Сегодня</div>
                ${match.messages.map(message => {
                    if (message.type === 'incoming') {
                        return `
                            <div class="max-w-[80%] self-start">
                                <div class="bg-white/5 p-4 rounded-2xl rounded-tl-none text-sm border border-white/5">${escapeHtml(message.text)}</div>
                                <span class="text-[9px] text-gray-600 ml-1 mt-1 block">${escapeHtml(message.time)}</span>
                            </div>
                        `;
                    }
                    return `
                        <div class="max-w-[80%] self-end">
                            <div class="bg-energyOrange p-4 rounded-2xl rounded-tr-none text-sm font-medium shadow-lg shadow-energyOrange/10">${escapeHtml(message.text)}</div>
                            <div class="flex justify-end gap-1 mt-1 mr-1">
                                <span class="text-[9px] text-gray-600 block">${escapeHtml(message.time)}</span>
                                <i class="fa-solid fa-check-double text-[9px] text-energyOrange"></i>
                            </div>
                        </div>
                    `;
                }).join('')}
            `;
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const match = Matches.find(item => item.id === activeMatchId);
            const now = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            match.messages.push({ type: 'outgoing', text, time: now });
            match.preview = text;
            match.time = now;
            input.value = '';
            renderDialogs();
            renderMessages(match);
        }
    </script>
</body>
</html>
